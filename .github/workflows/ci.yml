name: CI

on:
  push:
    branches: [main]
  pull_request:

# No `env:` block and no `secrets` anywhere in this file, deliberately. The suite
# must pass without credentials; if a module starts reading an API key at import
# time, this workflow is what catches it.
#
# Linux and Windows, one Python version. Windows is here because it is where this
# project is developed, and one class of bug exists only there: text-mode file
# writes turn every newline into a carriage return plus newline, which once made
# every freshly ingested contract fail its own fingerprint check. Linux cannot
# reproduce that, so only a Windows run can guard against it. Windows minutes are
# billed at twice the Linux rate on private repositories (D-001); for a suite that
# runs in seconds, that is worth paying.

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest
