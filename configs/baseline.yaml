# Keyword search: the baseline every other configuration is compared against.
# Runs offline and costs nothing, because BM25 needs no model.
name: baseline

corpus:
  name: cuad
  version: v1
  hash: null                      # filled by ingestion

chunking:
  strategy: fixed_char
  size: 2000                      # characters; about 500 tokens
  overlap: 250

embedding:                        # unused by BM25; kept so every config has one shape
  model: openai/text-embedding-3-small

retrieval:
  method: bm25
  top_k: 5

generation:
  model: meta-llama/llama-3.1-8b-instruct   # D-010: cheap, deliberately modest
  prompt: prompts/generate/v1.md            # written when generation is built
  temperature: 0.0
  max_output_tokens: 512

judge:
  model: deepseek/deepseek-v4-flash         # D-010: leading candidate; decided in Phase 8
  rubric: prompts/judge/v1.md               # written when the judge is built
  max_output_tokens: 512
