# Hybrid: keyword search and OpenAI small vector search, rankings merged by rank.
# Reuses both existing indexes, so it costs only the embedding of each question.
name: hybrid-openai-small

corpus:
  name: cuad
  version: v1
  hash: null                      # filled by ingestion

chunking:
  strategy: fixed_char
  size: 2000                      # characters; about 500 tokens
  overlap: 250

embedding:
  model: openai/text-embedding-3-small

retrieval:
  method: hybrid                  # D-014: reciprocal rank fusion, defaults untuned
  hybrid:
    rank_constant: 60
    candidates: 100
  top_k: 5

generation:
  model: meta-llama/llama-3.1-8b-instruct   # D-010: cheap, deliberately modest
  prompt: prompts/generate/v1.md            # written when generation is built
  temperature: 0.0
  max_output_tokens: 512

judge:
  model: deepseek/deepseek-v4-flash         # D-010: leading candidate; decided in Phase 8
  rubric: prompts/judge/v1.md               # written when the judge is built
  max_output_tokens: 512
